name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Lighthouse (mobile) on key pages
        run: |
          npx --yes @lhci/cli@0.15.1 autorun \
            --collect.startServerCommand="npm start" \
            --collect.url=http://localhost:3000/ \
            --collect.url=http://localhost:3000/consultancy \
            --collect.url=http://localhost:3000/careers \
            --collect.url=http://localhost:3000/suppliers \
            --assert.assertions.categories:performance="warn" \
            --assert.assertions.categories:accessibility="error" \
            --upload.target=temporary-public-storage
        env:
          ALLOW_FILE_STORE: "1"
